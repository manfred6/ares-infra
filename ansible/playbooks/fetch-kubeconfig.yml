---
- name: Fetch admin kubeconfig to the provisioning host
  hosts: k3s_servers[0]
  become: true
  gather_facts: false

  vars:
    kubeconfig_path: "{{ playbook_dir }}/../artifacts/kubeconfig.yaml"

  tasks:
    - name: Set master api endpoint
      ansible.builtin.set_fact:
        kubeconfig_server: "{{ k3s_node_ip | default(ansible_host) }}"

    - name: Ensure api endpoint set correctly
      ansible.builtin.assert:
        that: kuberconfig_server | length > 0

    - name: Ensure local artifacts directory exists
      ansible.builtin.file:
        path: "{{ kubeconfig_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch k3s kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_path }}"
        flat: true

    - name: Point kubeconfig at the k3s API
      ansible.builtin.replace:
        path: "{{ kubeconfig_path }}"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ kubeconfig_server }}:6443"
      delegate_to: localhost
      become: false
