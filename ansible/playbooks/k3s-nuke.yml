---
- name: Remove k3s from all server nodes
  hosts: k3s_servers
  become: true
  gather_facts: false
  tasks:
    - name: Check for k3s uninstall script
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: k3s_uninstall

    - name: Uninstall k3s
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      when: k3s_uninstall.stat.exists

    - name: Remove remaining k3s configuration and state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
        - /etc/cni/net.d
        - /var/lib/cni
      ignore_errors: true
