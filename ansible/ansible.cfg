[defaults]
inventory = /root/ares-infra/ansible/inventory/hosts.ini
roles_path = /root/ares-infra/ansible/roles
private_key_file = /root/ares-infra/terraform/.secrets/k3s_ed25519
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
