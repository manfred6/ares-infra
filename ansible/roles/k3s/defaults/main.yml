---
# K3s cluster defaults
k3s_version: "v1.36.4+k3s1"
k3s_flannel_backend: vxlan
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_cluster_domain: cluster.local
k3s_api_sans: []

# K3s should use the non-stub systemd-resolved resolver file so CoreDNS sees
# the real upstream resolver rather than 127.0.0.53.
k3s_resolv_conf: "/etc/rancher/k3s/resolv.conf"
# Optional node DNS configuration. Set k3s_dns_server to your OPNsense LAN IP.
k3s_dns_server: ""
k3s_dns_search_domain: "{{ lab_domain | default('') }}"
